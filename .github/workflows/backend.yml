name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start database
        run: docker compose -f docker-compose.yml up -d db

      - name: Wait for database
        run: |
          for i in {1..30}; do
            docker compose -f docker-compose.yml exec -T db pg_isready -U user -d rdf && break
            sleep 2
          done

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://user:pass@localhost:5432/rdf
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://user:pass@localhost:5432/rdf
        run: pytest -q
